<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeRoute DC</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div id="searchBox">
    <form id="destinationForm">
      <input type="text" id="destinationInput" placeholder="Enter destination" autocomplete="off" required />
      <button type="submit">Get Distance</button>
    </form>
    <ul id="autocompleteList"></ul>
    <p id="locationDisplay">Location: Not yet requested</p>
    <p id="distanceDisplay"></p>
  </div>

  <!-- Map below -->
  <div id="map"></div>
  <script type="module" src="./js/routing.js"></script>
</body>
</html>
