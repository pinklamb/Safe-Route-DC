<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Safe Route DC</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div id="routeInfo"></div>

  <div id="searchBox">
    <form id="routeForm">
      <input
        type="text"
        id="startInput"
        placeholder="Enter starting point"
        autocomplete="off"
        required
      />
      <input
        type="text"
        id="destinationInput"
        placeholder="Enter destination"
        autocomplete="off"
        required
      />

      <button type="submit" id="routeButton">Get Route & Safety</button>
    </form>
    <ul id="autocompleteList"></ul>

    <p id="locationDisplay">Start Location: Not yet requested</p>
    <p id="distanceDisplay"></p>
  </div>

  <div id="map"></div>

  <script type="module" src="./js/routing.js" defer></script>
</body>
</html>
